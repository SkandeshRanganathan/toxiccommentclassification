project:
  name: prototype_augmented_toxic_detection
  experiment_name: full_model
  output_dir: outputs
  checkpoint_dir: checkpoints
  log_dir: outputs/logs

data:
  raw_train_path: data/raw/train.csv
  processed_dir: data/processed
  text_column: comment_text
  id_column: id
  labels: [toxic, severe_toxic, obscene, threat, insult, identity_hate]
  validation_size: 0.10
  test_size: 0.10
  split_search_trials: 32
  max_length: 256
  num_workers: 0
  pin_memory: true

model:
  encoder_name: microsoft/deberta-v3-base
  initialization_checkpoint: null
  num_labels: 6
  dropout: 0.20
  projection_dim: null
  use_prototypes: true
  use_adaptive_selector: true
  use_prototype_attention: true
  use_label_correlation: true

retrieval:
  memory_dir: outputs/prototype_memory
  index_type: flat
  top_k: 16
  selected_k: 8
  nlist: 100
  nprobe: 10
  hnsw_m: 32
  exclude_self: true

selector:
  hidden_dim: 256
  dropout: 0.10
  temperature: 0.7
  hard_top_k: 8

attention:
  num_heads: 8
  dropout: 0.10

label_correlation:
  hidden_dim: 256
  dropout: 0.10
  regularization_weight: 0.0001

training:
  seed: 42
  batch_size: 8
  eval_batch_size: 16
  epochs: 5
  learning_rate: 2.0e-5
  encoder_learning_rate: 1.0e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.10
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: true
  deterministic: true
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0001
  monitor: macro_f1
  resume_from: null
  log_every_steps: 50

thresholds:
  optimize: true
  grid_min: 0.05
  grid_max: 0.95
  grid_steps: 91
  default: 0.50

evaluation:
  save_predictions: true
  generate_plots: true
